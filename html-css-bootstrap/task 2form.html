<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <form>
        <fieldset>
        <p align="center"> Kindly fill in this form in register</p><br>

        <label>UserName:</label><br>
        <input type="text" name="fullname" placeholder="Enter your name"><br><br>

        <label>Email:</label><br>
        <input type="email" name="email" placeholder="Enter your email"><br><br>

        <label>Password:</label><br>
        <input type="Password" name="password" placeholder="Enter password"><br><br>

        <label>Repeat Paswword</label><br>
        <input type="tel" name="password" placeholder="Enter Password"><br><br>

        <label> Birth date</label><br>
        <input type="date" name="date" placeholder="Enter your date of birth"><br><br>

        <label>Course:</label><br>

        <select name="course">
            <option>Select Course</option>
            <option>B.Tech</option>
            <option>BCA</option>
            <option>MCA</option>
            <option>M.Tech</option>
        </select>
        <br><br>
        <button type="button">Register</button>
    <br><br>
        <p align="center">
        Already have an account?
        </p>
        <a href="login.html">Login in</a>
        

        </fieldset>

    </form>

</body>
</html>
