<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Registration</h1>
        <hr>
        <div class="radio">
            <input type="radio" name="type" checked> Personal
            <input type="radio" name="type"> Company
        </div>
        <div class="input-box">
            <span>📧</span>
            <input type="email" placeholder="Email">
        </div>
        <div class="input-box">
            <span>👤</span>
            <input type="text" placeholder="Name">
        </div>
        
        <div class="input-box">
            <span>🔒</span>
            <input type="password" placeholder="Password">
        </div>
        <div class="gender">
            <input type="radio" name="gender" checked> Male
            <input type="radio" name="gender"> Female
        </div>
        <div class="bottom">
            <p>
                By clicking Register, you agree on our
                <a href="#">Terms</a> and
                <a href="#">Conditions</a>.
            </p>
            <button>Register</button>
        </div>
    </div>
</body>
</html>
