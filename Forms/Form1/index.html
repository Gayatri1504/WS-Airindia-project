<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h1>Register</h1>
        <p class="subtitle">Kindly fill in this form to register.</p>
        
        <form>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter Email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter Password" required>
            </div>
            
            <div class="form-group">
                <label for="confirm">Repeat Password</label>
                <input type="password" id="confirm" name="confirm_password" placeholder="Repeat Password" required>
            </div>
            
            <button type="submit">Register</button>
        </form>
        
        <p class="login-text">Already have an account? <a href="login.html">Log in.</a></p>
    </div>
</body>
</html>
