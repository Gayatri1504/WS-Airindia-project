<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login</title>

    <style>

        body{
            margin:0;
            padding:0;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background-color:#f0f2f5;
            font-family:Arial, sans-serif;
        }

        form{
            width:320px;
            padding:25px;
            border:1px solid #ccc;
            border-radius:10px;
            background:white;
            box-shadow:0px 0px 10px lightgray;
        }

        h2{
            text-align:center;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
            border:1px solid gray;
            border-radius:5px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:10px;
            border:none;
            border-radius:5px;
            background-color:#1877f2;
            color:white;
            cursor:pointer;
        }

        a{
            text-decoration:none;
            display:block;
            text-align:center;
            margin:15px 0;
        }

    </style>

</head>
<body>

<form>
    <h2>Log into Instagram</h2>
    <label>Mobile number, username or email</label><br>
    <input type="text" placeholder="Enter your username"><br>

    <label>Password</label><br>
    <input type="password" placeholder="Enter your password"><br>

    <button>Log In</button>

    <a href="#">Forgot Password?</a>

    <button type="button">Log in with Facebook</button>
    <br><br>

    <button type="button">Create New Account</button>

</form>

</body>
</html>
