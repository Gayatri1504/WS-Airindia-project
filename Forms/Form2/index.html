<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Login</title>
 <link rel="stylesheet" href="style.css">
</head>

<body>
    
    <div class="container">
        <div class="left">
             <h1>📷</h1>
             <h2>See everyday moments from <br>
            your
             <span>close friends.</span>
            </h2>
            
            <img src="img/image.png" alt="Instagram">
        
        </div>
        
        <div class="right">
            
            <h2>Log into Instagram</h2>
            <input type="text" placeholder="Mobile number, username or email">
            <input type="password" placeholder="Password">
            
            <button class="login">Log In</button>
            <a href="#">Forgot password?</a>
            <button class="facebook">Log in with Facebook</button>
            <button class="create">Create new account</button>
        </div>
    </div>
</body>
</html>
